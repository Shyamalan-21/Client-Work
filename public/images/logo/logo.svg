<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="35%" stop-color="#C6A15B" />
      <stop offset="70%" stop-color="#E8D5A2" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <linearGradient id="crimsonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D92732" />
      <stop offset="50%" stop-color="#B71925" />
      <stop offset="100%" stop-color="#8F1018" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(15, 10)">
    <!-- Outer Sacred Kalasam/Arch -->
    <path d="M 55 10 C 25 10 12 35 12 65 C 12 95 35 115 55 118 C 75 115 98 95 98 65 C 98 35 85 10 55 10 Z" 
          stroke="url(#goldGradient)" stroke-width="2.5" fill="none" opacity="0.9" />
    
    <!-- Inner ornamental halo -->
    <path d="M 55 18 C 32 18 20 38 20 65 C 20 90 38 107 55 110 C 72 107 90 90 90 65 C 90 38 78 18 55 18 Z" 
          stroke="url(#goldGradient)" stroke-width="1" stroke-dasharray="2,3" fill="none" opacity="0.7" />

    <!-- Center Silk Loom & Sacred Flame Emblem -->
    <!-- Lotus Petal Base -->
    <path d="M 35 88 C 45 82 65 82 75 88 C 68 95 42 95 35 88 Z" fill="url(#goldGradient)" />
    <path d="M 28 82 C 38 78 50 82 55 87 C 45 88 35 88 28 82 Z" fill="url(#goldGradient)" opacity="0.8" />
    <path d="M 82 82 C 72 78 60 82 55 87 C 65 88 75 88 82 82 Z" fill="url(#goldGradient)" opacity="0.8" />

    <!-- Divine Gada & Sacred Loom Spindle (Devotional Symbolism of Lord Maruthi & Silk Craft) -->
    <path d="M 55 24 L 55 82" stroke="url(#goldGradient)" stroke-width="2" />
    <!-- Gada Head / Kalash Top -->
    <circle cx="55" cy="38" r="14" fill="url(#crimsonGradient)" stroke="url(#goldGradient)" stroke-width="2" />
    <circle cx="55" cy="38" r="9" fill="url(#goldGradient)" opacity="0.85" />
    <!-- Crown Finial -->
    <polygon points="55,20 50,28 60,28" fill="url(#goldGradient)" />
    <!-- Flanking Loom Warp Lines -->
    <path d="M 38 42 Q 45 60 42 78" stroke="url(#goldGradient)" stroke-width="1.2" fill="none" opacity="0.75" />
    <path d="M 72 42 Q 65 60 68 78" stroke="url(#goldGradient)" stroke-width="1.2" fill="none" opacity="0.75" />
    <!-- Small ornamental gems -->
    <circle cx="55" cy="62" r="2.5" fill="#FFF" />
  </g>

  <!-- Typography -->
  <!-- "SRI" -->
  <text x="140" y="44" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16" font-weight="700" letter-spacing="6" fill="url(#goldGradient)">
    SRI
  </text>
  
  <!-- "MARUTHI" - Main Headline -->
  <text x="140" y="82" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="38" font-weight="900" letter-spacing="4" fill="#FFFFFF">
    MARUTHI
  </text>
  <text x="140" y="82" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="38" font-weight="900" letter-spacing="4" fill="url(#goldGradient)" opacity="0.3" filter="url(#goldGlow)">
    MARUTHI
  </text>

  <!-- "SILK CENTRE" -->
  <text x="142" y="106" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="9" fill="url(#goldGradient)">
    SILK CENTRE
  </text>

  <!-- Location Tagline & Divider -->
  <line x1="142" y1="116" x2="490" y2="116" stroke="url(#goldGradient)" stroke-width="1" opacity="0.5" />
  <circle cx="142" cy="116" r="2" fill="url(#goldGradient)" />
  <circle cx="490" cy="116" r="2" fill="url(#goldGradient)" />
  <text x="144" y="129" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.5" fill="#C6A15B" opacity="0.9">
    T. NAGAR, CHENNAI • OLD SILK BUYERS
  </text>
</svg>
